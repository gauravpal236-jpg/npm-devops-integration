name: Node.js CI Pipeline

on:
  push:
    branches:
      - KAN-1-gaurav-integrate-npm-project-with-devops-integration

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
